plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.proyek.multicloner'
    compileSdk 34

    defaultConfig {
        applicationId "com.proyek.multicloner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // Blackbox membutuhkan arsitektur native yang jelas
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Memasukkan core engine virtualisasi BlackBox yang sesungguhnya
    implementation 'com.github.FBlackBox:BlackBox:v1.6.0' 
}
